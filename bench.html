<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1ec">
  <title>Magma Mia! — test bench</title>
  <link rel="stylesheet" href="styles.css?v=20260921v">
  <script src="src/engine.js?v=20260921v" defer></script>
  <script src="src/levels.js?v=20260921v" defer></script>
  <script src="src/render.js?v=20260921v" defer></script>
  <script src="src/bench.js?v=20260921v" defer></script>
</head>

<body>
  <main class="app">
    <section class="play-area">
      <div class="masthead">
        <h1>Magma Mia!</h1>
        <p class="subtitle">Rules test bench — <a href="index.html">back to the game</a></p>
      </div>

      <p id="objective" class="objective"></p>
      <div id="board-wrap" class="board-wrap">
        <svg id="board" class="board" role="img" aria-label="Game board"></svg>
      </div>
      <p id="status" class="status" aria-live="polite"></p>

      <div class="controls">
        <button id="undo-button" type="button">Undo</button>
        <button id="restart-button" type="button">Restart</button>
        <div class="dpad" aria-label="Move">
          <button class="dpad-up" data-dir="up" type="button" aria-label="Move up">↑</button>
          <button class="dpad-left" data-dir="left" type="button" aria-label="Move left">←</button>
          <button class="dpad-down" data-dir="down" type="button" aria-label="Move down">↓</button>
          <button class="dpad-right" data-dir="right" type="button" aria-label="Move right">→</button>
        </div>
      </div>
      <p class="keys-hint">Arrow keys or WASD to move, Z to undo, R to restart. Or click a cell next to the player.</p>

      <details class="panel" open>
        <summary>Settings</summary>
        <label class="field">
          <span>Objective</span>
          <select id="objective-select"></select>
        </label>
        <label class="field field-check">
          <input id="lava-fatal" type="checkbox" checked>
          <span>Lava is fatal (otherwise the move is refused)</span>
        </label>
      </details>

      <details class="panel" open>
        <summary>Levels</summary>
        <label class="field">
          <span>Preset</span>
          <select id="preset-select"></select>
        </label>
        <label class="field">
          <span>Level text</span>
          <textarea id="level-text" rows="7" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
        </label>
        <div class="button-row">
          <button id="load-button" type="button">Load this level</button>
        </div>
        <p id="level-error" class="level-error" role="alert" hidden></p>
        <p class="legend">
          <code>.</code> floor &nbsp; <code>#</code> wall &nbsp; <code>@</code> player &nbsp;
          <code>a</code>–<code>z</code> lava depth 1–26 &nbsp; <code>A</code>–<code>Z</code> stack height 1–26 &nbsp;
          <code>*</code> after a cell marks a goal
        </p>
      </details>

      <details class="panel">
        <summary>Current position as text</summary>
        <pre id="current-text" class="current-text"></pre>
      </details>
    </section>
  </main>
</body>

</html>
